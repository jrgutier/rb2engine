[project]
name = "rb2engine"
version = "0.1.0"
description = "Convert rekordbox USB exports to Engine DJ libraries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jrgutier" }]
dependencies = [
    "kaitaistruct",
    "pyrekordbox~=0.4.4",
    "click",
    "rich",
    "mutagen",
]

[project.scripts]
rb2engine = "rb2engine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "real_stick: requires the real rekordbox USB stick mounted (Tier B; skipped in CI)",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rb2engine"]
strict = false

# construct, pyrekordbox and mutagen ship no type stubs / py.typed marker.
# Their absence is a fact about upstream, not a defect here.
[[tool.mypy.overrides]]
module = ["construct.*", "pyrekordbox.*", "mutagen.*"]
ignore_missing_imports = true
